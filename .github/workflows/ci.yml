name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Tests
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

      - name: Selbsttest
        run: dotnet run --project src/QrrQ.Cli -c Release --no-build -- --selftest 100
