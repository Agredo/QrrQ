name: NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (empty = 0.0.0-dev.<Run>)'
        required: false
        type: string

permissions:
  contents: write

env:
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Tests
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack the packages
        run: |
          dotnet pack src/QrrQ/QrrQ.csproj -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.value }}
          dotnet pack src/QrrQ.Cli/QrrQ.Cli.csproj -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.value }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Publish to nuget.org
        if: env.NUGET_API_KEY != ''
        run: |
          for package in artifacts/*.nupkg artifacts/*.snupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Note without an API key
        if: env.NUGET_API_KEY == ''
        run: echo "::warning::Secret NUGET_API_KEY is missing - the packages were only provided as an artifact."

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.nupkg artifacts/*.snupkg \
            --title "QrrQ $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --clobber
